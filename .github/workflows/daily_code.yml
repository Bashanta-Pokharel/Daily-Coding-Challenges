name: Daily Practice Runner & Verification Pipeline

on:
  schedule:
    # Every day at 7:00 PM Nepal Time (13:15 UTC)
    - cron: '15 13 * * *'
  workflow_dispatch:

jobs:
  practice-suite:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git environment
        run: |
          git config --global user.name "Bashanta-Pokharel"
          git config --global user.email "pbasanta340@gmail.com"

      - name: Execute daily practice session & verification
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Commit practice progress
        run: |
          git add .
          git diff --cached --quiet || git commit -m "Daily coding practice - $(date +'%Y-%m-%d')"

      - name: Push practice progress
        run: |
          git push origin main
