name: Daily Practice Runner & Verification Pipeline

on:
  schedule:
    # Runs every day at 7:00 PM Nepal Time (NPT UTC+05:45 => 13:15 UTC)
    - cron: '15 13 * * *'
  workflow_dispatch:

jobs:
  practice-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config --global user.name "Bashanta-Pokharel"
          git config --global user.email "pbasanta340@gmail.com"

      - name: Execute daily practice session & generate commits
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Push practice commits to GitHub
        run: |
          git pull --rebase origin main
          git push origin main

