name: Daily 4x Nepal Practice Push (6AM, 12PM, 6PM, 10PM)

on:
  schedule:
    # 6:00 AM Nepal Time (NPT UTC+05:45 => 00:15 UTC)
    - cron: '15 0 * * *'
    # 12:00 PM Nepal Time (NPT UTC+05:45 => 06:15 UTC)
    - cron: '15 6 * * *'
    # 6:00 PM Nepal Time (NPT UTC+05:45 => 12:15 UTC)
    - cron: '15 12 * * *'
    # 10:00 PM Nepal Time (NPT UTC+05:45 => 16:15 UTC)
    - cron: '15 16 * * *'
  workflow_dispatch:

jobs:
  practice-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config --global user.name "Bashanta-Pokharel"
          git config --global user.email "pbasanta340@gmail.com"

      - name: Execute daily practice session & generate commits
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Push practice commits to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git pull --rebase origin main || true
          git push origin main

