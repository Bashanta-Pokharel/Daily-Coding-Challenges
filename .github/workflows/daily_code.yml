name: Daily Practice Runner & Verification Pipeline

on:
  schedule:
    # Primary trigger: 7:00 PM Nepal Time (NPT UTC+05:45 => 13:15 UTC)
    - cron: '15 13 * * *'
    # Backup triggers: 7:30 PM, 8:00 PM, 9:00 PM Nepal Time to guarantee execution
    - cron: '45 13 * * *'
    - cron: '15 14 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:

jobs:
  practice-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config --global user.name "Bashanta-Pokharel"
          git config --global user.email "pbasanta340@gmail.com"

      - name: Execute daily practice session & generate commits
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Push practice commits to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git pull --rebase origin main || true
          git push origin main


