name: Daily Practice Runner & Verification Pipeline

on:
  schedule:
    # Daily sync between 1:00 PM and 10:00 PM local time (07:15 UTC + offset)
    - cron: '15 7 * * *'
  workflow_dispatch:

jobs:
  practice-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync schedule offset
        run: |
          RANDOM_DELAY=$((RANDOM % 32400))
          sleep $RANDOM_DELAY

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git environment
        run: |
          git config --global user.name "Bashanta-Pokharel"
          git config --global user.email "pbasanta340@gmail.com"

      - name: Execute daily practice session & verification
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Push practice progress
        run: |
          git push origin main

