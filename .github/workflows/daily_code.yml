name: Randomized Daily Code & Multi-Commit Practice

on:
  schedule:
    # Triggers daily starting at 3:00 PM local time (09:15 UTC)
    - cron: '15 9 * * *'
  workflow_dispatch:

jobs:
  daily-practice:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Randomized Time Delay (3:00 PM - 11:00 PM Window)
        run: |
          # Random sleep delay between 0 and 7.5 hours (0 to 27000 seconds)
          RANDOM_DELAY=$((RANDOM % 27000))
          MINUTES=$((RANDOM_DELAY / 60))
          echo "Sleeping for $RANDOM_DELAY seconds ($MINUTES minutes) so commit happens randomly between 3:00 PM and 11:00 PM..."
          sleep $RANDOM_DELAY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author (Matches GitHub Profile for Green Dots)
        run: |
          git config --global user.name "Bashanta-Pokharel"
          git config --global user.email "pbasanta340@gmail.com"

      - name: Run Multi-Code & Multi-Commit Generator
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Push All Daily Commits
        run: |
          git push origin main
