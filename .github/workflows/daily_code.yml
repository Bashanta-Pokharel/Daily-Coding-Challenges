name: Randomized Daily Code & Multi-Commit Practice

on:
  schedule:
    # Triggers daily at 11:00 PM local time (17:15 UTC)
    - cron: '15 17 * * *'
  workflow_dispatch:

jobs:
  daily-practice:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Randomized Time Delay (11:00 PM - 11:59 PM Window)
        run: |
          # Random sleep between 0 and 55 minutes (0 to 3300 seconds)
          RANDOM_DELAY=$((RANDOM % 3300))
          echo "Sleeping for $RANDOM_DELAY seconds so commit happens randomly between 11:00 PM and 11:59 PM..."
          sleep $RANDOM_DELAY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config --global user.name "Daily Code Bot"
          git config --global user.email "bot@dailycode.local"

      - name: Run Multi-Code & Multi-Commit Generator
        run: |
          chmod +x ./scripts/daily_code_generator.py
          python3 ./scripts/daily_code_generator.py

      - name: Push All Daily Commits
        run: |
          git push origin main
